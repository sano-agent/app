<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Biblioteca do SanoAgent — explore recursos sobre teoria musical, bem-estar e inspiração para suas composições.">
  <title>Biblioteca — SanoAgent</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .library-page { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    
    .search-section {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-box { flex: 1; min-width: 250px; position: relative; }
    .search-box input { padding-left: 2.5rem; }
    .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #999; }

    .category-scroll {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding: 0.5rem 0;
      margin-bottom: 1.5rem;
      scrollbar-width: thin;
    }
    .category-btn {
      padding: 0.5rem 1.25rem;
      white-space: nowrap;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: white;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
    }
    .category-btn.active, .category-btn:hover {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .resources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .resource-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }
    .resource-card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    
    .resource-thumb {
      height: 160px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
    }
    .resource-type-tag {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: bold;
    }

    .resource-content { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .resource-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--dark-color); }
    .resource-desc { font-size: 0.9rem; color: #666; margin-bottom: 1rem; flex: 1; }
    
    .resource-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #999;
    }

    .featured-badge {
      background: var(--secondary-color);
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      grid-column: 1 / -1;
    }
    .empty-icon { font-size: 4rem; opacity: 0.3; margin-bottom: 1rem; }
  


/* codex-school-community-ux: ajustes finos para uso recorrente por comunidade escolar */

  --codex-school-field-border: rgba(120, 132, 156, 0.45);

  --codex-school-field-text: #1f2937;
  --codex-school-muted-text: #64748b;

  --codex-school-safe-bottom: max(16px, env(safe-area-inset-bottom));
}

:where(html) {
  scroll-behavior: smooth;

:where(body) {

:where(.actions, .form-actions, .button-row, .toolbar, .topbar, nav, [role="toolbar"]) {

:where(.card, .panel, .box, .tile, .item, .list-item, .action-card) {

:where(.section, .surface, .widget, .modal-content, .dialog-content, .drawer, .dropdown, .menu) {

:where(table) {

}

:where(table, .table, .data-table) {
  max-width: 100%;
}

:where(.table-wrap, .table-wrapper, .table-container, .responsive-table) {

@media (max-width: 420px) {

  }

  }

    scrollbar-width: thin;
  }

    display: none !important;
  }
}
</style>

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

    </nav>

  <script>
    const RESOURCES = [
      { id: 1, title: 'Bases da Tropicália', desc: 'Entenda os ritmos e harmonias que definiram o movimento tropicalista brasileiro.', type: 'PDF', cat: 'teoria', icon: '🎸', featured: true, views: 1240 },
      { id: 2, title: 'Escrita Terapêutica', desc: 'Como usar o diário como ferramenta de autoconhecimento e regulação emocional.', type: 'ARTIGO', cat: 'bem-estar', icon: '📝', featured: false, views: 856 },
      { id: 3, title: 'Estruturas de Verso', desc: 'Guia prático para criar rimas e métricas envolventes em suas músicas.', type: 'GUIA', cat: 'composicao', icon: '🎼', featured: true, views: 2100 },
      { id: 4, title: 'Meditação e Criatividade', desc: 'Exercícios de mindfulness para desbloquear o fluxo criativo antes de escrever.', type: 'VIDEO', cat: 'bem-estar', icon: '🧘', featured: false, views: 543 },
      { id: 5, title: 'História do Rock Nacional', desc: 'Uma jornada pelas décadas de 80 e 90 do rock no Brasil.', type: 'ARTIGO', cat: 'inspiracao', icon: '🤟', featured: false, views: 921 },
      { id: 6, title: 'Acordes para Iniciantes', desc: 'Os primeiros passos no violão para quem quer acompanhar suas letras.', type: 'VIDEO', cat: 'teoria', icon: '🎵', featured: false, views: 3412 },
      { id: 7, title: 'Uso do Gemini na Música', desc: 'Dicas avançadas para obter as melhores rimas usando nossa IA.', type: 'TUTORIAL', cat: 'tutoriais', icon: '🤖', featured: true, views: 1560 },
      { id: 8, title: 'Higiene do Sono', desc: 'A importância do descanso para a saúde mental e performance artística.', type: 'PDF', cat: 'bem-estar', icon: '🌙', featured: false, views: 432 }
    ];

    let activeCategory = 'all';

    function renderResources(items) {
      const grid = document.getElementById('resourcesGrid');
      
      if (items.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <h3>Nenhum recurso encontrado</h3>
            <p>Tente ajustar seus termos de busca ou filtros.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map(r => `
        <article class="resource-card">
          <div class="resource-thumb">
            ${r.icon}
            <span class="resource-type-tag">${r.type}</span>
          </div>
          <div class="resource-content">
            ${r.featured ? '<span class="featured-badge">Destaque</span>' : ''}
            <h3 class="resource-title">${r.title}</h3>
            <p class="resource-desc">${r.desc}</p>
            <div class="resource-meta">
              <span>📂 ${r.cat.toUpperCase()}</span>
              <span>👁️ ${r.views}</span>
            </div>
            <button type="button" class="btn btn-primary btn-sm" style="margin-top: 1rem; width: 100%;" aria-label="Acessar Conteúdo" onclick="var c=this.closest('.resource-card');var v=c&&c.querySelector('.resource-meta span:last-child');if(v){var n=parseInt((v.textContent.match(/\d+/)||[0])[0],10)+1;v.textContent='👁️ '+n;}this.textContent='Conteúdo acessado ✓';this.disabled=true;">Acessar Conteúdo</button>
          </div>
        </article>
      `).join('');
    }

    function filterResources() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const sortBy = document.getElementById('sortSelect').value;
      
      let filtered = RESOURCES.filter(r => {
        const matchesQuery = r.title.toLowerCase().includes(query) || r.desc.toLowerCase().includes(query);
        const matchesCat = activeCategory === 'all' || r.cat === activeCategory;
        return matchesQuery && matchesCat;
      });

      if (sortBy === 'popular') filtered.sort((a,b) => b.views - a.views);
      else if (sortBy === 'a-z') filtered.sort((a,b) => a.title.localeCompare(b.title));
      // 'newest' is default order in mock

      renderResources(filtered);
    }

    function setCategory(cat) {
      activeCategory = cat;
      const btns = document.querySelectorAll('.category-btn');
      btns.forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase().includes(cat) || (cat === 'all' && btn.textContent === 'Todos'));
      });
      filterResources();
    }

    document.addEventListener('DOMContentLoaded', () => renderResources(RESOURCES));
  </script>

(function() {

      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');

      button.setAttribute('type', 'button');
    });
  });
})();

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
