<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Centro de notificações do SanoAgent — acompanhe alertas, composições prontas e atualizações do sistema.">
  <title>Notificações — SanoAgent</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Page-specific tokens ──────────────────────────────────────── */
    .notif-page { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }

    .notif-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .notif-header h1 { font-size: 1.6rem; color: var(--dark-color); }

    .notif-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    /* ── Filter tabs ───────────────────────────────────────────────── */
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 0.4rem 1rem;
      border: 2px solid var(--border-color);
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
    }
    .filter-tab:hover,
    .filter-tab.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    /* ── Notification item ────────────────────────────────────────── */
    .notif-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .notif-item {
      background: white;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow);
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      border-left: 4px solid transparent;
      transition: var(--transition);
      position: relative;
    }
    .notif-item.unread  { border-left-color: var(--primary-color); background: #f0f7ff; }
    .notif-item.success { border-left-color: var(--success-color); }
    .notif-item.warning { border-left-color: var(--warning-color); }
    .notif-item.error   { border-left-color: var(--error-color);   }

    .notif-icon {
      font-size: 1.6rem;
      min-width: 2rem;
      text-align: center;
      margin-top: 0.1rem;
    }
    .notif-body { flex: 1; }
    .notif-title {
      font-weight: 600;
      color: var(--dark-color);
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }
    .notif-text  { color: #555; font-size: 0.9rem; line-height: 1.5; }
    .notif-time  { color: #999; font-size: 0.8rem; margin-top: 0.35rem; }

    .notif-dismiss {
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 1.1rem;
      padding: 0.25rem;
      border-radius: 4px;
      line-height: 1;
      transition: var(--transition);
    }
    .notif-dismiss:hover { color: var(--error-color); background: #ffeaea; }

    /* ── Unread badge ─────────────────────────────────────────────── */
    .badge-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--error-color);
      color: white;
      min-width: 1.4rem;
      height: 1.4rem;
      font-size: 0.75rem;
      font-weight: 700;
      margin-left: 0.5rem;
    }

    /* ── Preferences panel ────────────────────────────────────────── */
    .pref-panel {
      background: white;
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 1.25rem;
      margin-top: 2rem;
    }
    .pref-panel h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--dark-color); }
    .pref-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    .pref-row:last-child { border-bottom: none; }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle input { display: none; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: #ccc;
      border-radius: 24px;
      cursor: pointer;
      transition: var(--transition);
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      background: white;
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: var(--transition);
    }
    .toggle input:checked + .toggle-slider { background: var(--primary-color); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

    /* ── Empty state ──────────────────────────────────────────────── */
    .notif-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #999;
    }
    .notif-empty .empty-icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .notif-empty p { font-size: 1rem; }

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

    <!-- Filtros -->
    <nav class="filter-tabs" aria-label="Filtrar notificações" role="tablist">
      <button  class="filter-tab active" data-filter="all"      onclick="setFilter(this,'all')"     role="tab" aria-selected="true" aria-label="Todas">Todas</button>
      <button  class="filter-tab"        data-filter="unread"   onclick="setFilter(this,'unread')"  role="tab" aria-label="Não lidas">Não lidas</button>
      <button  class="filter-tab"        data-filter="success"  onclick="setFilter(this,'success')" role="tab" aria-label="✅ Concluídas"><i class="material-icons cdx-mi" aria-hidden="true">check_circle</i> Concluídas</button>
      <button  class="filter-tab"        data-filter="warning"  onclick="setFilter(this,'warning')" role="tab" aria-label="⚠️ Avisos"><i class="material-icons cdx-mi" aria-hidden="true">warning</i> Avisos</button>

    </nav>

      <!-- Preenchido por JS -->

    <section class="pref-panel" aria-labelledby="prefTitle">
      <h2 id="prefTitle"><i class="material-icons cdx-mi" aria-hidden="true">settings</i> Preferências de Notificação</h2>

      <div class="pref-row">
        <label for="togComposition">Composição gerada</label>

  <script>
    /* ── Data ──────────────────────────────────────────────────────── */
    const MOCK_NOTIFICATIONS = [
      { id:1, type:'success', icon:'🎵', title:'Composição gerada!',       text:'Sua letra em estilo Rock foi criada com sucesso a partir da entrada de ontem.',        time:'Há 5 minutos',  unread:true  },
      { id:2, type:'success', icon:'✅', title:'Entrada salva',            text:'Seu pensamento bom "Aprendi algo novo hoje" foi registrado.',                          time:'Há 2 horas',    unread:true  },
      { id:3, type:'warning', icon:'⚠️', title:'Limite de entradas',       text:'Você está próximo do limite diário de entradas (8/10). Continue assim!',               time:'Há 4 horas',    unread:false },
      { id:4, type:'error',   icon:'❌', title:'Falha na geração',         text:'Houve um problema ao gerar sua composição. Tente novamente em alguns instantes.',      time:'Há 1 dia',      unread:false },
      { id:5, type:'success', icon:'🏆', title:'Nova conquista desbloqueada!', text:'Você ganhou o badge "Escritor Consistente" por 7 entradas seguidas!',              time:'Há 2 dias',     unread:false },
      { id:6, type:'',        icon:'ℹ️', title:'Atualização do sistema',   text:'O SanoAgent foi atualizado para a versão 1.1.0. Confira as novidades.',                time:'Há 3 dias',     unread:false },
    ];

    let notifications  = [...MOCK_NOTIFICATIONS];
    let currentFilter  = 'all';

    /* ── Render ────────────────────────────────────────────────────── */
    function render() {
      const list    = document.getElementById('notifList');
      const counter = document.getElementById('unreadCount');

      const visible = currentFilter === 'all'    ? notifications
                    : currentFilter === 'unread' ? notifications.filter(n => n.unread)
                    :                               notifications.filter(n => n.type === currentFilter);

      const unread = notifications.filter(n => n.unread).length;
      counter.textContent = unread;
      counter.style.display = unread > 0 ? 'inline-flex' : 'none';

      if (visible.length === 0) {
        list.innerHTML = `
          <div class="notif-empty" role="status">
            <div class="empty-icon">🔔</div>
            <p>Nenhuma notificação encontrada.</p>
          </div>`;
        return;
      }

      list.innerHTML = visible.map(n => `
        <article class="notif-item ${n.type} ${n.unread ? 'unread' : ''}"
                 role="listitem"
                 aria-label="${n.title}${n.unread ? ' — não lida' : ''}">
          <span class="notif-icon" aria-hidden="true">${n.icon}</span>
          <div class="notif-body">
            <p class="notif-title">${n.title}</p>
            <p class="notif-text">${n.text}</p>
            <p class="notif-time">
              <time>${n.time}</time>
              ${n.unread ? '<span class="badge badge-primary" style="margin-left:.5rem;font-size:.7rem;">Nova</span>' : ''}
            </p>
          </div>
          <button class="notif-dismiss"
                  onclick="dismiss(${n.id})"
                  aria-label="Dispensar notificação: ${n.title}">✕</button>
        </article>
      `).join('');

      /* Mark as read on scroll-into-view */
      visible.filter(n => n.unread).forEach(n => {
        const el = list.children[visible.indexOf(n)];
        if (!el) return;
        const obs = new IntersectionObserver(entries => {
          if (entries[0].isIntersecting) { markRead(n.id); obs.disconnect(); }
        }, { threshold: 0.8 });
        obs.observe(el);
      });
    }

    function markRead(id) {
      const n = notifications.find(x => x.id === id);
      if (n) { n.unread = false; render(); }
    }

    function markAllRead() {
      notifications.forEach(n => n.unread = false);
      render();
    }

    function dismiss(id) {
      notifications = notifications.filter(n => n.id !== id);
      render();
    }

    function clearAll() {
      notifications = [];
      render();
    }

    function setFilter(btn, filter) {
      document.querySelectorAll('.filter-tab').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      currentFilter = filter;
      render();
    }

    function savePref(key, value) {
      try { localStorage.setItem(`notif_pref_${key}`, value); } catch(_) {}
    }

    function loadPrefs() {
      ['composition','diary','system','weekly'].forEach(key => {
        const stored = localStorage.getItem(`notif_pref_${key}`);
        const el = document.getElementById(`tog${key.charAt(0).toUpperCase()}${key.slice(1)}`);
        if (el && stored !== null) el.checked = stored === 'true';
      });
    }

    /* ── Init ──────────────────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', () => { loadPrefs(); render(); });
  </script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
</body>
