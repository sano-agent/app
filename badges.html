<!--
  @fileoverview badges.html
  @description Sistema de conquistas e badges do SanoAgent.
  Exibe conquistas desbloqueadas, progresso de metas e ranking de atividade.
  @author SanoAgent Team
  @version 1.1.0
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Conquistas do SanoAgent — visualize seus badges desbloqueados e acompanhe seu progresso na jornada musical.">
  <title>Conquistas — SanoAgent</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Layout ────────────────────────────────────────────────────── */
    .badges-page  { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }

    .page-header {
      margin-bottom: 1.75rem;
    }
    .page-header h1 { font-size: 1.7rem; color: var(--dark-color); }
    .page-header p  { color: #666; margin-top: 0.35rem; font-size: 0.95rem; }

    /* ── XP / Level bar ────────────────────────────────────────────── */
    .level-banner {
      background: linear-gradient(135deg, var(--primary-color), #0e5a8a);
      color: white;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .level-circle {
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.15);
      border: 3px solid rgba(255,255,255,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .level-circle .lv    { font-size: 0.65rem; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.05em; }
    .level-circle .lv-num{ font-size: 1.4rem; font-weight: 700; line-height: 1; }

    .level-info { flex: 1; }
    .level-info .lv-title  { font-size: 1.1rem; font-weight: 600; }
    .level-info .lv-sub    { font-size: 0.85rem; opacity: 0.85; margin-top: 0.2rem; }
    .xp-bar-wrap  { margin-top: 0.6rem; }
    .xp-bar-track {
      height: 8px;
      background: rgba(255,255,255,0.25);
      border-radius: 8px;
      overflow: hidden;
    }
    .xp-bar-fill {
      height: 100%;
      background: white;
      border-radius: 8px;
      transition: width 0.8s ease;
    }
    .xp-labels { display: flex; justify-content: space-between; font-size: 0.75rem; opacity: 0.8; margin-top: 0.3rem; }

    /* ── Tabs ───────────────────────────────────────────────────────── */
    .badge-tabs    { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .badge-tab     {
      padding: 0.4rem 1rem;
      border: 2px solid var(--border-color);
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: var(--transition);
    }
    .badge-tab.active,
    .badge-tab:hover {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: white;
    }

    /* ── Badge grid ─────────────────────────────────────────────────── */
    .badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 1.25rem; }

    .badge-card {
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 1.25rem;
      text-align: center;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .badge-card:hover         { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
    .badge-card.locked        { opacity: 0.45; filter: grayscale(1); }
    .badge-card.locked:hover  { transform: none; box-shadow: var(--shadow); }

    .badge-icon {
      font-size: 2.8rem;
      margin-bottom: 0.6rem;
      display: block;
      line-height: 1;
    }
    .badge-name  { font-weight: 700; color: var(--dark-color); font-size: 0.9rem; margin-bottom: 0.2rem; }
    .badge-desc  { color: #777; font-size: 0.78rem; line-height: 1.4; }

    .badge-rarity {
      display: inline-block;
      margin-top: 0.6rem;
      padding: 0.15rem 0.6rem;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .rarity-common   { background: #e0e0e0; color: #555; }
    .rarity-uncommon { background: #c8e6c9; color: #2e7d32; }
    .rarity-rare     { background: #bbdefb; color: #1565c0; }
    .rarity-epic     { background: #e1bee7; color: #6a1b9a; }
    .rarity-legendary{ background: linear-gradient(135deg, #fff9c4, #ffcc02); color: #795500; }

    .badge-earned-date { font-size: 0.72rem; color: #aaa; margin-top: 0.4rem; }

    .badge-lock-icon {
      position: absolute;
      top: 0.6rem; right: 0.6rem;
      font-size: 0.9rem;
      opacity: 0.4;
    }

    /* ── Progress badges (with progress bar) ───────────────────────── */
    .badge-progress { margin-top: 0.6rem; }
    .progress-bar   {
      height: 5px;
      background: var(--border-color);
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill  {
      height: 100%;
      background: var(--primary-color);
      border-radius: 5px;
      transition: width 0.6s ease;
    }
    .progress-label { font-size: 0.72rem; color: #999; margin-top: 0.2rem; }

    /* ── Stats bar ──────────────────────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .stat-chip {
      background: white;
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 0.9rem;
      text-align: center;
    }
    .stat-chip .val { font-size: 1.6rem; font-weight: 700; color: var(--primary-color); }
    .stat-chip .lbl { font-size: 0.75rem; color: #888; margin-top: 0.15rem; }

  --codex-ds-primary: var(--codex-gentle-primary);

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

  });

/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
</body>
</html>
